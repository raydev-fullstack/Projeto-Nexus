<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="" stylesheet" href="style.css">
    <title>NEXUS MOTORS</title>
</head>

<body>
    <header>

        <div class="header-logo">
            <a href="">
                <span>NEXUS</span>
                <span>MOTORS</span>
            </a>
        </div>

        <div class="menu-mobile">
            <button type="button">
                <img src="./img/icon-menu-mobile.svg" aria-label="Abrir menu" alt="">
            </button>
        </div>

        <div class="header-navigation">
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Estoque</a></li>
                    <li><a href="#">Serviços</a></li>
                    <li><a href="#">Financiamento</a></li>
                    <li><a href="#">Sobre nós</a></li>
                    <li><a href="#">Contato</a></li>

                </ul>
            </nav>

        </div>

        <div class="header-contact">
            <address>
                <a href="#">
                    <img src="./img/icon-header.png" alt="">
                    <span>(99)1215165565</span>
                    <span>Atendimento</span>
                </a>
            </address>
        </div>

        <div class="btn-cta">

            <button type="button">
                Fale Conosco
            </button>

        </div>

    </header>

    <main>
        <section class="hero-apresentação">

            <div>

            <p>- POTÊNCIA, DESIGN E PERFORMANCE -</p>

            <h1>MOVIDOS POR 
                PAIXÃO
            </h1>

            <p>Os melhores carros, as melhores condições
                e o luxo que você merece.
            </p>

            </div>

            <div class="group-actions">
                <button type="button"><img src="./img/icon-carro.png" alt="icon-carro" >Ver estoque</button>
                <button type="button"><img src="./img/icon-volante.png" alt="icon-volante" >Fazer simulação</button>
            </div>

           
            <img src="./img/hero mustang nexus.png" alt="ford mustang" width="600px" height="300px">
          
        </section>



    </main>










</body>

</html>
